name: Frontend CI Test (Frontend)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the source code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Install and configure Node.js
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'
        cache: 'npm'
        cache-dependency-path: ./code/bluejay-webui/package-lock.json

    # 3. Compile the code using working-directory
    - name: Npm install
      working-directory: code/bluejay-webui
      run: npm i

    # 4. Install Vitest provider
    - name: Install Vitest coverage provider
      working-directory: code/bluejay-webui
      run: npm install --no-save @vitest/coverage-v8@4.1.11

    # 5. Execute tests with coverage
    - name: Run Tests
      working-directory: code/bluejay-webui
      run: npm run-script test -- --coverage --watch=false

    - name: Add frontend coverage to Actions summary
      if: always()
      run: |
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        coverage_dir = Path("code/bluejay-webui/coverage")
        summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
        reports = list(coverage_dir.rglob("coverage-summary.json"))

        if not reports:
            summary.write_text(
                "## Frontend test coverage\n\n"
                "Coverage summary unavailable. Check the frontend test step.\n",
                encoding="utf-8",
            )
            raise SystemExit(0)

        totals = {
            "lines": {"covered": 0, "total": 0},
            "branches": {"covered": 0, "total": 0},
            "functions": {"covered": 0, "total": 0},
        }

        for report in reports:
            data = json.loads(report.read_text(encoding="utf-8"))
            for metric, values in totals.items():
                covered = data.get(metric, {}).get("pct", 0)
                total = data.get(metric, {}).get("total", 0)
                values["covered"] += int(covered * total / 100) if total else 0
                values["total"] += total

        def coverage_row(label, metric):
            covered = totals[metric]["covered"]
            total = totals[metric]["total"]
            percentage = covered * 100 / total if total else 0
            return f"| {label} | {covered} | {total - covered} | {percentage:.1f}% |"

        lines = [
            "## Frontend test coverage (Vitest)",
            "",
            "| Metric | Covered | Missed | Coverage |",
            "| --- | ---: | ---: | ---: |",
            coverage_row("Lines", "lines"),
            coverage_row("Branches", "branches"),
            coverage_row("Functions", "functions"),
            "",
        ]
        with summary.open("a", encoding="utf-8") as output:
            output.write("\n".join(lines))
        PY
