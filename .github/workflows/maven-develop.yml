name: Java CI with Maven (Backend)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the source code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Java 21 environment with dependency caching
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin' # Popular production-ready OpenJDK distribution
        cache: 'maven'         # Automatically caches your ~/.m2 dependencies to speed up builds

    # 3. Compile the code using working-directory
    - name: Compile Backend with Maven
      working-directory: code/api
      run: mvn clean compile
