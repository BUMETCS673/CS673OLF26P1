name: Java CI with Maven (Backend)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the source code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Java 21 environment with dependency caching
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin' # Popular production-ready OpenJDK distribution
        cache: 'maven'         # Automatically caches your ~/.m2 dependencies to speed up builds

    # 3. Compile the code using working-directory
    - name: Compile Backend with Maven
      working-directory: code/api
      run: mvn clean compile

    # 4. Execute Unit Tests
    - name: Run Junit Tests
      working-directory: code/api
      run: mvn test

    - name: Add backend coverage to Actions summary
      if: always()
      run: |
        python - <<'PY'
        import os
        import xml.etree.ElementTree as ET
        from pathlib import Path

        report = Path("code/api/target/site/jacoco/jacoco.xml")
        summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

        if not report.exists():
            summary.write_text(
                "## Backend test coverage\n\n"
                "JaCoCo report unavailable. Check the Maven test step.\n",
                encoding="utf-8",
            )
            raise SystemExit(0)

        counters = {
            counter.attrib["type"]: counter.attrib
            for counter in ET.parse(report).getroot().findall("counter")
        }

        def coverage_row(label, counter_type):
            counter = counters.get(counter_type, {})
            covered = int(counter.get("covered", 0))
            missed = int(counter.get("missed", 0))
            total = covered + missed
            percentage = covered * 100 / total if total else 0
            return f"| {label} | {covered} | {missed} | {percentage:.1f}% |"

        lines = [
            "## Backend test coverage (JaCoCo)",
            "",
            "| Metric | Covered | Missed | Coverage |",
            "| --- | ---: | ---: | ---: |",
            coverage_row("Instructions", "INSTRUCTION"),
            coverage_row("Lines", "LINE"),
            coverage_row("Branches", "BRANCH"),
            "",
        ]
        with summary.open("a", encoding="utf-8") as output:
            output.write("\n".join(lines))
        PY
