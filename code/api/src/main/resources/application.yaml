spring:
  application:
    name: bluejay

  # Database Configuration
  datasource:
    url: jdbc:mysql://bluejay_mysql:3306/bluejay_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: bluejay_user
    password: bluejay_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA & Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Flyway Database Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Custom Security & JWT Application Properties
app:
  jwt:
    # 256-bit base64 secret key
    # TODO: Make more secure later
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: always