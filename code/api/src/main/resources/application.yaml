spring:
  application:
    name: bluejay

  # Database Configuration
  datasource:
    url: jdbc:mysql://bluejay_mysql:3306/bluejay_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: bluejay_user
    password: bluejay_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA & Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Flyway Database Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Custom Security & JWT Application Properties
app:
  jwt:
    # 256-bit base64 secret key
    # TODO: Make more secure later
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours

# Actuator Health Endpoint
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: always

# Scalar OpenAPI Docs
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  # Instructs SpringDoc to bind OpenAPI/Scalar to Actuator management routes
  use-management-port: false # Set to true ONLY if management.server.port is set
  show-actuator: true

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  actuatorEnabled: true

  # Hides the interactive "Test Request" / API client panel in Scalar
  hideTestRequestButton: true

  # Allows readers to download the openapi.json or openapi.yaml directly from Scalar UI
  documentDownloadType: both

  # Built-in Themes: default, alternate, moon, purple, solarized,
  # blue_planet, saturn, kepler, mars, deepSpace, laserwave, none
  theme: blue_planet

  # Control theme mode and UI controls
  darkMode: true
  hideDarkModeToggle: false
