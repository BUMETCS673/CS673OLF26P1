<section class="list-card">
  <header class="list-header">
    <div>
      <h2>Product catalog</h2>
      <p>Browse products in the catalog.</p>
    </div>
  </header>

  @if (loading()) { <mat-progress-bar mode="indeterminate" /> }
  @if (error()) { <p class="error" role="alert">{{ error() }}</p> }

  <div class="table-container">
    <table mat-table [dataSource]="products()" aria-label="Product catalog">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Product</th>
        <td mat-cell *matCellDef="let product">{{ product.name }}</td>
      </ng-container>
      <ng-container matColumnDef="barcode">
        <th mat-header-cell *matHeaderCellDef>Barcode</th>
        <td mat-cell *matCellDef="let product">{{ product.barcode }}</td>
      </ng-container>
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let product">{{ product.categoryName || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Price</th>
        <td mat-cell *matCellDef="let product">{{ product.price | currency }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="empty-cell" [attr.colspan]="displayedColumns.length">
          @if (!loading() && !error()) { No products found. }
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator [length]="paginatorLength()" [pageIndex]="page() - 1" [pageSize]="pageSize()"
    [pageSizeOptions]="[5, 10, 25, 50]" [disabled]="loading() || !!error()"
    aria-label="Select product catalog page" (page)="changePage($event)" />
</section>
