<main class="page">
  <header class="page-heading">
    <p class="eyebrow">CATALOG MANAGEMENT</p>
    <h1>Products</h1>
    <p>Search, browse, and add products to your catalog.</p>
  </header>

  <div class="columns">
    <section class="catalog-column" aria-label="Product catalog">
      <app-product-search (search)="productList.applyFilters($event)" />
      <app-product-list #productList />
    </section>
    <app-product-form (created)="productList.loadPage(1)" />
  </div>
</main>
